<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmare - Vânzare</title>
    <link rel="stylesheet" href="../assets/css/vanzare.css" type="text/css">
  </head>
  <body>
    <h2>Mesajul tău a fost înregistrat!</h2>
    <p id="userStatus"></p>
    <section class="thanks">Mulțumim — imaginile încărcate:</section>
    <div id="savedImages" class="photo-preview" aria-live="polite"></div>

    <h3>Detalii formular</h3>
    <div id="formSummary" aria-live="polite"></div>

    <br>
    <button id="clearBtn" class="btn">Șterge imaginile salvate</button>
    <button id="editBtn" class="btn">Editează formularul</button>
    <button id="profileBtn" class="btn">Vezi istoricul</button>
    <button id="backBtn" class="btn">Înapoi la formular</button>

    <script src="../assets/js/confirmare.js"></script>
  </body>
</html>
