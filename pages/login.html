<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logare / Înregistrare</title>
    <link rel="stylesheet" href="../assets/css/vanzare.css" type="text/css">
  </head>
  <body>
    <h2>Logare / Înregistrare</h2>
    <div id="loginStatus" style="margin-bottom:1rem;color:#e63600;"></div>

    <div>
      <h3>Autentificare</h3>
      <label>Username: <input id="loginUser" /></label><br>
      <label>Parolă: <input id="loginPass" type="password" /></label><br>
      <button id="loginBtn">Logare</button>
    </div>

    <hr>

    <div>
      <h3>Înregistrare</h3>
      <label>Username: <input id="regUser" /></label><br>
      <label>Parolă: <input id="regPass" type="password" /></label><br>
      <button id="regBtn">Înregistrează</button>
    </div>

    <p id="msg"></p>

    <script src="../assets/js/login.js"></script>
  </body>
</html>
