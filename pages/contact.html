<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <link rel="stylesheet" href="../assets/css/contact.css">
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">AutoShow</div>
    </nav>
    <main>
      <h1>Contactează-ne</h1>
      <p>Dacă ai întrebări despre modelele noastre sau vrei să programezi o vizită, completează formularul de mai jos.</p>
      <form id="contactForm" novalidate>
        <label for="name">Nume</label>
        <input id="name" name="name" type="text" required minlength="2">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="phone">Telefon</label>
        <input id="phone" name="phone" type="tel" pattern="[0-9]{10}" placeholder="0770123456">

        <label for="message">Mesaj</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit" class="btn">Trimite</button>
        <div id="contactMsg" aria-live="polite" style="margin-top:12px;"></div>
      </form>

      <section id="savedMessages" aria-live="polite" class="saved-messages"></section>
      <div class="page-bottom" style="margin-top:1.5rem; text-align:center;">
        <a href="index.html" class="btn">Înapoi la pagina principală</a>
      </div>
    </main>

    <script src="../assets/js/contact.js"></script>
  </body>
</html>
